services:
  resolverr:
    image: ghcr.io/nick2253/resolverr:latest
    container_name: resolverr
    restart: unless-stopped
    environment:
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=${SEERR_API_KEY}
      - RESOLVERR_WEBHOOK_SECRET=${RESOLVERR_WEBHOOK_SECRET}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - AUTO_APPROVE=false
      - BASE_URL=https://resolverr.nkcx.net
      - DATABASE_PATH=/data/resolverr.db
    volumes:
      - resolverr-data:/data
    expose:
      - 8787
    labels:
      - traefik.enable=true
      - traefik.http.routers.resolverr.rule=Host(`resolverr.nkcx.net`)
      - traefik.http.routers.resolverr.entrypoints=websecure
      - traefik.http.routers.resolverr.tls=true
      - traefik.http.services.resolverr.loadbalancer.server.port=8787
    networks:
      - default
      - traefik_proxy

volumes:
  resolverr-data:

networks:
  traefik_proxy:
    external: true
